# Netlify build settings.
# If GOOGLE_TTS_KEY is set in Netlify (Project configuration → Environment variables),
# each build first creates natural-voice clips for any new words, then builds the site.
# The key is only used during the build; it never reaches the website.
[build]
  command = "npm run audio:deploy && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's free plan stops builds after 15 minutes: spend at most 5 per language on audio.
  TTS_TIME_LIMIT = "5"

# Security headers for every page.
# - CSP: only this site's own scripts, YouTube's player and Supabase (accounts) may run or be contacted.
# - No framing of the app by other sites (clickjacking), HTTPS only, no MIME sniffing,
#   microphone only for this site (Speaking practice), no camera/location/payments.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https://i.ytimg.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# The service worker must always be fresh so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
