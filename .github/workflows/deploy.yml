# Builds and publishes the app to GitHub Pages on every push.
# If the GOOGLE_TTS_KEY secret is set, it first generates natural-voice audio for any
# new words/sentences (Spanish and German) and commits the new clips back to the branch.
name: Deploy

on:
  push:
    branches: [main, claude/spanish-learning-platform-x0ckgi]
  workflow_dispatch:

permissions:
  contents: write # commit generated audio
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      # Secrets can't be read in `if:` directly; expose only whether one is set.
      HAS_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate missing audio
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        if: ${{ env.HAS_TTS_KEY == 'true' }}
        run: |
          npm run audio -- --verbs
          HABLO_LANG=de npm run audio -- --verbs

      - name: Commit new audio
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ -n "$(git status --porcelain public/audio)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/audio
            git commit -m "Add generated audio [skip ci]"
            git push
          fi

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: pages
        uses: actions/deploy-pages@v4
